<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f3f6f8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .input-pill {
            background-color: #ffffff;
            border-radius: 9999px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
        }
        .btn-green {
            background-color: #169854;
        }
        .btn-green:hover {
            background-color: #128046;
        }
        .text-brand-green {
            color: #169854;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Top White Header -->
    <header class="bg-white px-5 py-4 flex items-center justify-between shadow-xs">
        <button type="button" class="text-brand-green focus:outline-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
            </svg>
        </button>
        <h1 class="text-xl font-bold text-brand-green">Register</h1>
        <div class="w-6"></div>
    </header>

    <!-- Main Form Section -->
    <main class="flex-1 flex flex-col items-center px-6 pt-8 pb-10 max-w-md w-full mx-auto">
        <form id="registerForm" class="w-full space-y-5">
            
            <!-- Username -->
            <div class="input-pill flex items-center px-5 py-3.5">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-brand-green mr-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
                <input type="text" id="username" placeholder="Username" required class="w-full bg-transparent text-gray-800 placeholder-gray-400 text-base focus:outline-none">
            </div>

            <!-- Password -->
            <div class="input-pill flex items-center px-5 py-3.5">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-brand-green mr-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
                <input type="password" id="password" placeholder="Password" required class="w-full bg-transparent text-gray-800 placeholder-gray-400 text-base focus:outline-none">
            </div>

            <!-- M-PIN -->
            <div class="input-pill flex items-center px-5 py-3.5">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-brand-green mr-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
                <input type="password" id="mpin" placeholder="M-PIN" maxlength="6" required class="w-full bg-transparent text-gray-800 placeholder-gray-400 text-base focus:outline-none">
            </div>

            <!-- Phone -->
            <div class="input-pill flex items-center px-5 py-3.5">
                <span class="text-brand-green font-semibold text-base mr-4 shrink-0">+91</span>
                <input type="tel" id="phone" placeholder="Phone Number" maxlength="10" required class="w-full bg-transparent text-gray-800 placeholder-gray-400 text-base focus:outline-none">
            </div>

            <!-- Referral Code -->
            <div class="input-pill flex items-center px-5 py-3.5">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-brand-green mr-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
                </svg>
                <input type="text" id="referral" placeholder="Referral Code" class="w-full bg-transparent text-gray-800 placeholder-gray-400 text-base focus:outline-none">
            </div>

            <!-- Sign Up Button -->
            <div class="pt-4">
                <button type="submit" class="w-full py-4 btn-green text-white font-semibold text-lg rounded-full shadow-md transition">
                    Sign Up
                </button>
            </div>
        </form>

        <!-- Bottom Links -->
        <div class="text-center mt-6 space-y-5">
            <p class="text-gray-800 text-base underline">
                Already have an account? <a href="#" class="font-medium">Login</a>
            </p>
            <div>
                <a href="#" class="text-blue-600 text-base underline font-medium">Download App</a>
            </div>
        </div>
    </main>

    <!-- OTP Modal Popup -->
    <div id="otpModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-5 z-50">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 relative shadow-xl text-center">
            
            <!-- Close Button -->
            <button type="button" onclick="closeModal()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 hover:bg-gray-200 focus:outline-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>

            <!-- Top OTP Sent Info -->
            <h2 class="text-xl font-bold text-gray-900 mt-2">OTP Sent</h2>
            <p class="text-sm text-gray-500 mt-2">
                A 6-digit code has been sent to <span class="font-bold text-gray-800">+91</span><br>
                <span id="displayPhone" class="font-bold text-gray-800"></span>
            </p>

            <!-- Second OTP Sent Header (Exact Match to Screenshot) -->
            <h3 class="text-xl font-bold text-gray-900 mt-5">OTP Sent</h3>
            <p class="text-sm text-gray-500 mt-2 mb-5">
                A 6-digit code has been sent to <span class="font-bold text-gray-800">+91</span>
            </p>

            <!-- 6 OTP Boxes -->
            <div id="otpContainer" class="flex justify-between gap-2 mb-6">
                <input type="text" inputmode="numeric" maxlength="1" class="otp-box w-11 h-12 text-center text-xl font-semibold bg-gray-50 border-2 border-[#169854] rounded-xl focus:outline-none">
                <input type="text" inputmode="numeric" maxlength="1" class="otp-box w-11 h-12 text-center text-xl font-semibold bg-gray-50 border border-gray-200 rounded-xl focus:border-[#169854] focus:border-2 focus:outline-none">
                <input type="text" inputmode="numeric" maxlength="1" class="otp-box w-11 h-12 text-center text-xl font-semibold bg-gray-50 border border-gray-200 rounded-xl focus:border-[#169854] focus:border-2 focus:outline-none">
                <input type="text" inputmode="numeric" maxlength="1" class="otp-box w-11 h-12 text-center text-xl font-semibold bg-gray-50 border border-gray-200 rounded-xl focus:border-[#169854] focus:border-2 focus:outline-none">
                <input type="text" inputmode="numeric" maxlength="1" class="otp-box w-11 h-12 text-center text-xl font-semibold bg-gray-50 border border-gray-200 rounded-xl focus:border-[#169854] focus:border-2 focus:outline-none">
                <input type="text" inputmode="numeric" maxlength="1" class="otp-box w-11 h-12 text-center text-xl font-semibold bg-gray-50 border border-gray-200 rounded-xl focus:border-[#169854] focus:border-2 focus:outline-none">
            </div>

            <!-- Resend Timer -->
            <p class="text-sm text-gray-500 mb-6">
                Didn't get the code? <span id="resendText" class="font-semibold text-gray-700">Resend OTP (57s)</span>
            </p>

            <!-- Submit Button -->
            <button type="button" onclick="verifyOtp()" class="w-full py-3.5 btn-green text-white font-semibold text-base rounded-full shadow-md transition">
                Submit
            </button>

            <!-- Verification Message -->
            <p id="statusMsg" class="mt-4 text-base font-bold hidden"></p>
        </div>
    </div>

    <script>
        const registerForm = document.getElementById('registerForm');
        const otpModal = document.getElementById('otpModal');
        const displayPhone = document.getElementById('displayPhone');
        const otpBoxes = document.querySelectorAll('.otp-box');
        const statusMsg = document.getElementById('statusMsg');
        const resendText = document.getElementById('resendText');
        let timerInterval;

        registerForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const phoneVal = document.getElementById('phone').value.trim();
            displayPhone.textContent = phoneVal;

            // Reset OTP inputs & status
            otpBoxes.forEach((box, idx) => {
                box.value = '';
                if (idx === 0) {
                    box.classList.add('border-2', 'border-[#169854]');
                    box.classList.remove('border', 'border-gray-200');
                } else {
                    box.classList.remove('border-2', 'border-[#169854]');
                    box.classList.add('border', 'border-gray-200');
                }
            });
            statusMsg.classList.add('hidden');

            // Show Modal
            otpModal.classList.remove('hidden');
            otpModal.classList.add('flex');
            otpBoxes[0].focus();

            startTimer(57);
        });

        function closeModal() {
            otpModal.classList.add('hidden');
            otpModal.classList.remove('flex');
            clearInterval(timerInterval);
        }

        function startTimer(seconds) {
            clearInterval(timerInterval);
            let timeLeft = seconds;
            resendText.textContent = `Resend OTP (${timeLeft}s)`;
            timerInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    resendText.textContent = `Resend OTP (${timeLeft}s)`;
                } else {
                    clearInterval(timerInterval);
                    resendText.innerHTML = `<button type="button" onclick="startTimer(57)" class="text-brand-green underline">Resend OTP</button>`;
                }
            }, 1000);
        }

        // Handle OTP Box Navigation & Active Border Styling
        otpBoxes.forEach((box, index) => {
            box.addEventListener('focus', () => {
                otpBoxes.forEach(b => {
                    b.classList.remove('border-2', 'border-[#169854]');
                    b.classList.add('border', 'border-gray-200');
                });
                box.classList.remove('border', 'border-gray-200');
                box.classList.add('border-2', 'border-[#169854]');
            });

            box.addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
                if (e.target.value.length === 1 && index < otpBoxes.length - 1) {
                    otpBoxes[index + 1].focus();
                }
            });

            box.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    otpBoxes[index - 1].focus();
                }
            });
        });

        // Verify any 6-digit OTP
        function verifyOtp() {
            let otpValue = '';
            otpBoxes.forEach(box => otpValue += box.value);

            statusMsg.classList.remove('hidden', 'text-red-600', 'text-brand-green');

            if (otpValue.length === 6) {
                statusMsg.textContent = 'Verification Successful';
                statusMsg.classList.add('text-brand-green');
            } else {
                statusMsg.textContent = 'Please enter a 6-digit OTP';
                statusMsg.classList.add('text-red-600');
            }
        }
    </script>
</body>
</html>
